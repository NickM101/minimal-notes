[package]
name = "minimal-notes"
version = "0.2.0"
edition = "2021"

[dependencies]
gpui-kit = "0.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
raw-window-handle = "0.6.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# Release builds are shippable artifacts: size-optimized, stripped, and
# linked with thin LTO. Dependency crates keep opt-level 3 (see above).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
