name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libclang-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libegl1-mesa-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dir="notty-${VERSION}-x86_64-linux"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/minimal-notes" "$dir/notty"
          cp README.md LICENSE "$dir/"
          tar czf "notty-${VERSION}-x86_64-linux.tar.gz" "$dir"
          sha256sum "notty-${VERSION}-x86_64-linux.tar.gz" > "notty-${VERSION}-x86_64-linux.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $dir = "notty-$version-x86_64-windows"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/minimal-notes.exe" "$dir/Notty.exe"
          Copy-Item README.md, LICENSE $dir/
          Compress-Archive -Path $dir -DestinationPath "notty-$version-x86_64-windows.zip"
          (Get-FileHash "notty-$version-x86_64-windows.zip" -Algorithm SHA256).Hash |
            Out-File "notty-$version-x86_64-windows.zip.sha256"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          generate_release_notes: true
