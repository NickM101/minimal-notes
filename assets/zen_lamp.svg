<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 580" width="440" height="580" role="img" aria-label="Cream pendant lamp with pear-shaped cap and round globe" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cord" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e4e2bd"/>
      <stop offset="0.5" stop-color="#f1f0d2"/>
      <stop offset="1" stop-color="#d6d4ac"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e6e4bf"/>
      <stop offset="0.35" stop-color="#f3f2d6"/>
      <stop offset="0.75" stop-color="#e3e1ba"/>
      <stop offset="1" stop-color="#cfcda3"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#f8f7e0"/>
      <stop offset="0.45" stop-color="#eeedc9"/>
      <stop offset="0.8" stop-color="#dddbb2"/>
      <stop offset="1" stop-color="#cac89c"/>
    </radialGradient>
    <linearGradient id="seam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#cfcda3"/>
      <stop offset="0.5" stop-color="#e2e0b9"/>
      <stop offset="1" stop-color="#bfbd92"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cord -->
  <rect x="215" y="0" width="10" height="200" fill="url(#cord)"/>

  <!-- Cap (pear-shaped top) -->
  <path d="M190 218 C190 197 200 188 220 188 C240 188 248 197 248 218 C250 262 270 300 276 336 L160 336 C167 300 188 262 190 218 Z" fill="url(#cap)"/>
  <!-- cap highlight -->
  <path d="M203 225 C202 245 196 275 186 315" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>

  <!-- Globe -->
  <path d="M166 338 C120 366 98 410 100 455 C102 510 155 550 219 550 C283 550 336 510 338 455 C340 410 317 366 272 338 Z" fill="url(#globe)"/>
  <!-- globe gloss -->
  <ellipse cx="165" cy="420" rx="34" ry="52" fill="url(#gloss)" transform="rotate(-18 165 420)"/>

  <!-- Seam between cap and globe -->
  <path d="M160 334 Q219 350 276 334 L272 346 Q219 362 166 346 Z" fill="url(#seam)"/>
</svg>
